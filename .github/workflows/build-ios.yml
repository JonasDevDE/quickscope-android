name: Build & Publish iOS TestFlight

on:
  push:
    branches:
      - flutter
    paths:
      - 'lib/**'
      - 'test/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (leave blank to auto-calculate)'
        required: false
        type: string
        default: ''
      build_name:
        description: 'Version name override (leave blank to use pubspec.yaml)'
        required: false
        type: string
        default: ''

# Benoetigte Repository-Secrets:
#   IOS_CERTIFICATE_BASE64            Distribution-Zertifikat als .p12, base64-kodiert
#   IOS_CERTIFICATE_PASSWORD          Passwort der .p12
#   IOS_PROVISIONING_PROFILE_BASE64   App-Store-Provisioning-Profil fuer com.quickscopelearn, base64-kodiert
#   APP_STORE_CONNECT_API_KEY / _KEY_ID / _ISSUER_ID   fuer den TestFlight-Upload
# Optional: GOOGLE_WEB_CLIENT_ID, GOOGLE_IOS_CLIENT_ID, BASE_URL (als dart-define)

jobs:
  build-ios:
    name: Build & Publish Quickscope iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Determine Version and Build Number
        id: versioning
        run: |
          PUBVER=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r ')
          BN="${{ github.event.inputs.build_number }}"
          NAME="${{ github.event.inputs.build_name }}"
          [ -z "$BN" ] && BN="${PUBVER#*+}"
          [ -z "$NAME" ] && NAME="${PUBVER%%+*}"
          echo "BUILD_NUMBER=$BN" >> $GITHUB_ENV
          echo "BUILD_NAME=$NAME" >> $GITHUB_ENV
          echo "Using version: $NAME, build: $BN"

      - name: Pruefen, ob alle Secrets vorhanden sind
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=""
          [ -z "$IOS_CERTIFICATE_BASE64" ] && missing="$missing IOS_CERTIFICATE_BASE64"
          [ -z "$IOS_CERTIFICATE_PASSWORD" ] && missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "$APP_STORE_CONNECT_API_KEY" ] && missing="$missing APP_STORE_CONNECT_API_KEY"
          [ -z "$APP_STORE_CONNECT_KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Repository-Secrets:$missing. Abbruch, es wird nichts unsigniert gebaut."
            exit 1
          fi

      - name: Build iOS Release Bundle (Unsigned)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          DART_DEFINES=()
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] && DART_DEFINES+=("--dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID")
          [ -n "$GOOGLE_IOS_CLIENT_ID" ] && DART_DEFINES+=("--dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID")
          [ -n "$BASE_URL" ] && DART_DEFINES+=("--dart-define=BASE_URL=$BASE_URL")
          flutter build ios --release --no-codesign \
            --build-name="${{ env.BUILD_NAME }}" \
            --build-number="${{ env.BUILD_NUMBER }}" \
            "${DART_DEFINES[@]}"

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          
          # Patch all Info.plist files recursively with consistent versions
          python3 -c '
          import glob, plistlib, os
          build_name = os.environ.get("BUILD_NAME", "1.0.0")
          build_number = os.environ.get("BUILD_NUMBER", "1")
          for p in glob.glob("build/ios/ipa/Payload/Runner.app/**/Info.plist", recursive=True):
              try:
                  real_p = os.path.realpath(p)
                  with open(real_p, "rb") as f:
                      pl = plistlib.load(f)
                  if not pl.get("CFBundleShortVersionString") or "$(" in str(pl.get("CFBundleShortVersionString")):
                      pl["CFBundleShortVersionString"] = build_name
                  if not pl.get("CFBundleVersion") or "$(" in str(pl.get("CFBundleVersion")):
                      pl["CFBundleVersion"] = build_number
                  with open(real_p, "wb") as f:
                      plistlib.dump(pl, f)
                  print(f"Patched Info.plist: {p}")
              except Exception as e:
                  print(f"Error patching {p}: {e}")
          '

      - name: Sign IPA for App Store / TestFlight
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASS"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Signing-Identitaet aus dem Schluesselbund ermitteln
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          fi
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY="Apple Distribution: Tjorven Liebe (Q6327QV28T)"
          fi
          echo "Selected Signing Identity: '$SIGNING_IDENTITY'"

          # Provisioning-Profil und Entitlements vorbereiten
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          python3 ios/scripts/extract_entitlements.py "$PROFILE_PATH" "$RUNNER_TEMP/entitlements.plist"

          KEYCHAIN_ARG="--keychain $KEYCHAIN_PATH"

          # 1. Sign all embedded frameworks first
          if [ -d "build/ios/ipa/Payload/Runner.app/Frameworks" ]; then
            find build/ios/ipa/Payload/Runner.app/Frameworks -mindepth 1 -maxdepth 1 | while read -r fw; do
              if [ -d "$fw" ]; then
                /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" $KEYCHAIN_ARG --timestamp --options runtime "$fw"
                echo "Signed framework: $fw"
              fi
            done
          fi

          # 2. Sign Runner.app
          echo "Signing Runner.app bundle..."
          cp "$PROFILE_PATH" build/ios/ipa/Payload/Runner.app/embedded.mobileprovision
          /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" $KEYCHAIN_ARG --timestamp --options runtime \
            --entitlements "$RUNNER_TEMP/entitlements.plist" build/ios/ipa/Payload/Runner.app
          echo "Runner.app signed successfully!"

          # Verify signature
          /usr/bin/codesign -vvv --deep --strict build/ios/ipa/Payload/Runner.app

          # Clean up temporary keychain
          security delete-keychain "$KEYCHAIN_PATH" || true

          # 3. Package signed Payload into final IPA
          cd build/ios/ipa
          rm -f Quickscope.ipa
          zip -qr Quickscope.ipa Payload
          echo "Final signed App Store IPA packaged successfully!"

      - name: Upload to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="build/ios/ipa/Quickscope.ipa"
          if [ ! -f "$IPA" ]; then
            echo "::error::IPA Datei nicht gefunden: $IPA"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "Uploading $IPA to TestFlight..."
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "TestFlight upload completed successfully!"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Signing-Schluesselbund und Profile aufraeumen
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
