name: Build & Publish iOS TestFlight

on:
  push:
    branches:
      - flutter
    paths:
      - 'lib/**'
      - 'test/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (leave blank to auto-calculate)'
        required: false
        type: string
        default: ''
      build_name:
        description: 'Version name override (leave blank to use pubspec.yaml)'
        required: false
        type: string
        default: ''

# Benoetigte Repository-Secrets (nichts davon liegt im Repo):
#   IOS_CERTIFICATE_BASE64            Distribution-Zertifikat als .p12, base64-kodiert
#   IOS_CERTIFICATE_PASSWORD          Passwort der .p12
#   IOS_PROVISIONING_PROFILE_BASE64   App-Store-Provisioning-Profil fuer com.quickscopelearn, base64-kodiert
#   APP_STORE_CONNECT_API_KEY / _KEY_ID / _ISSUER_ID   fuer den TestFlight-Upload
# Optional: GOOGLE_WEB_CLIENT_ID, GOOGLE_IOS_CLIENT_ID, BASE_URL (als dart-define)

jobs:
  build-ios:
    name: Build & Publish Quickscope iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Determine Version and Build Number
        id: versioning
        run: |
          PUBVER=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r ')
          BN="${{ github.event.inputs.build_number }}"
          NAME="${{ github.event.inputs.build_name }}"
          [ -z "$BN" ] && BN="${PUBVER#*+}"
          [ -z "$NAME" ] && NAME="${PUBVER%%+*}"
          echo "BUILD_NUMBER=$BN" >> $GITHUB_ENV
          echo "BUILD_NAME=$NAME" >> $GITHUB_ENV
          echo "Using version: $NAME, build: $BN"

      - name: Pruefen, ob alle Secrets vorhanden sind
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=""
          [ -z "$IOS_CERTIFICATE_BASE64" ] && missing="$missing IOS_CERTIFICATE_BASE64"
          [ -z "$IOS_CERTIFICATE_PASSWORD" ] && missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "$APP_STORE_CONNECT_API_KEY" ] && missing="$missing APP_STORE_CONNECT_API_KEY"
          [ -z "$APP_STORE_CONNECT_KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Repository-Secrets:$missing. Abbruch, es wird nichts unsigniert gebaut."
            exit 1
          fi

      - name: Zertifikat und Provisioning-Profil installieren
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASS"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Provisioning-Profil ablegen; Name, UUID und Team werden daraus gelesen (nichts davon steht im Repo)
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

          # Signing-Identitaet aus dem Schluesselbund
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::Im Zertifikat wurde keine Signing-Identitaet gefunden (Datei oder Passwort pruefen)."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: ExportOptions.plist erzeugen
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${SIGNING_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.quickscopelearn</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: IPA bauen und signieren (Flutter Build IPA)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          DART_DEFINES=()
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] && DART_DEFINES+=("--dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID")
          [ -n "$GOOGLE_IOS_CLIENT_ID" ] && DART_DEFINES+=("--dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID")
          [ -n "$BASE_URL" ] && DART_DEFINES+=("--dart-define=BASE_URL=$BASE_URL")
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --build-name="${{ env.BUILD_NAME }}" \
            --build-number="${{ env.BUILD_NUMBER }}" \
            "${DART_DEFINES[@]}"
          ls -la build/ios/ipa

      - name: Upload to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Signing-Schluesselbund und Profile aufraeumen
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
