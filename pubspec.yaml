name: quickscope
description: "Quickscope – Lern-App für Prüfungsvorbereitung für Leute mit wenig Zeit."
publish_to: 'none'
version: 0.6.2+28

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  http_parser: ^4.1.1
  mime: ^2.0.0
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  just_audio: ^0.9.42
  audio_session: ^0.1.23
  record: ^7.1.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  open_filex: ^4.6.0
  share_plus: ^10.1.3
  google_sign_in: ^6.2.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  image: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/icons/
